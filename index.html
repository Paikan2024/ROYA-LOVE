<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Love Animation</title>
<style>
    body {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        background-color: #111;
        color: white;
        font-family: Arial, sans-serif;
        overflow: hidden;
    }

    .text {
        position: absolute;
        font-size: 2rem;
        opacity: 1;
        animation: fadeOut 4s forwards;
    }

    .heart {
        position: absolute;
        width: 100px;
        height: 100px;
        background-color: red;
        transform: rotate(-45deg) scale(0);
        animation: showHeart 4s forwards;
        animation-delay: 3s;
    }

    .heart::before,
    .heart::after {
        content: "";
        position: absolute;
        width: 100px;
        height: 100px;
        background-color: red;
        border-radius: 50%;
    }

    .heart::before {
        top: -50px;
        left: 0;
    }

    .heart::after {
        left: 50px;
        top: 0;
    }

    @keyframes fadeOut {
        0% { opacity: 1; }
        70% { opacity: 1; }
        100% { opacity: 0; transform: scale(0.5); }
    }

    @keyframes showHeart {
        0% { transform: rotate(-45deg) scale(0); }
        100% { transform: rotate(-45deg) scale(1.5); }
    }
</style>
</head>
<body>

<div class="text">I love you my love ❤️</div>
<div class="heart"></div>

</body>
</html>
